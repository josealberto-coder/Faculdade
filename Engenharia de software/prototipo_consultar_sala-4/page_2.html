<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <title>Protótipo</title>
    <link rel="stylesheet" href="style/style2.css">
</head>
<body>
    <main>
        <article>
            <h1>Consulte os horários</h1>

            <div class="sala_1">
                <h2>Sala-1</h2>

                <div class="consultar_horario">
                    <h3>Horário</h3>
                    <div class="horarios_1">
                        <ul>
                            <li>9h : <span id="status_9h">Livre (0/2)</span></li>
                            <li>10h: <span id="status_10h">Livre (0/2)</span></li>
                            <li>11h: <span id="status_11h">Livre (0/2)</span></li>
                        </ul>
                    </div>
                </div>

                <div class="reservar">
                    <h3>Reservar</h3>
                    <div class="reservas">
                        <ul>
                            <li>9h - <input type="button" value="Reservar" onclick="alterarReserva(9)"></li>
                            <li>10h - <input type="button" value="Reservar" onclick="alterarReserva(10)"></li>
                            <li>11h - <input type="button" value="Reservar" onclick="alterarReserva(11)"></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div id="reservas_feitas">
                <h3 class="cancelar_reserva">Cancelar</h3>

                <div class="reservas_hrs">
                    <ul>
                        <li><input type="button" value=" 9h " onclick="cancelar_reserva(9)"></li>
                        <li><input type="button" value="10h" onclick="cancelar_reserva(10)"></li>
                        <li><input type="button" value="11h" onclick="cancelar_reserva(11)"></li>
                    </ul>
                </div>
            </div>
        </article>

        <a href="index.html" target="_self" rel="prev" class="botao_voltar">
            <img src="image/botao_voltar.webp" alt="Voltar">
        </a>
    </main>

    <script>
        const LIMITE_POR_HORARIO = 2;
        const ANTECEDENCIA_HORAS = 1;
        const reservasPorHorario = {
            9: 0,
            10: 0,
            11: 0
        };
        const lembretesEnviados = {
            9: false,
            10: false,
            11: false
        };

        document.addEventListener("DOMContentLoaded", () => {
            Object.keys(reservasPorHorario).forEach(hora => {
                atualizarHorario(Number(hora));
            });
            atualizarBlocoCancelar();
            verificarLembretes();
            setInterval(verificarLembretes, 1000);
        });

        function verificarLembretes() {
            const agora = new Date();
            const horaAtual = agora.getHours();
            const minutoAtual = agora.getMinutes();

            Object.keys(reservasPorHorario).forEach(chaveHora => {
                const hora = Number(chaveHora);
                const qtdReservas = reservasPorHorario[hora];
                const horaLembrete = hora - ANTECEDENCIA_HORAS;

                if (qtdReservas <= 0) return;

                if (horaAtual === horaLembrete && minutoAtual === 0 && !lembretesEnviados[hora]) {
                    lembretesEnviados[hora] = true;
                    alert(`Lembrete: faltam 1 hora para a reserva das ${hora}h na Sala-1 (${qtdReservas}/${LIMITE_POR_HORARIO} ocupada).`);
                }
            });
        }

        function alterarReserva(hora) {
            if (reservasPorHorario[hora] >= LIMITE_POR_HORARIO) {
                alert(`Capacidade máxima atingida! O horário das ${hora}h já possui ${LIMITE_POR_HORARIO}/${LIMITE_POR_HORARIO} reservas.`);
                return;
            }

            reservasPorHorario[hora]++;
            atualizarHorario(hora);
            atualizarBlocoCancelar();

            const qtdAtual = reservasPorHorario[hora];
            const horaLembrete = hora - ANTECEDENCIA_HORAS;
            const avisoLembrete = `O aluno receberá um lembrete 1 hora antes (às ${horaLembrete}h).`;

            if (qtdAtual === LIMITE_POR_HORARIO) {
                alert(`Reserva das ${hora}h confirmada! Capacidade máxima atingida (${qtdAtual}/${LIMITE_POR_HORARIO}). ${avisoLembrete}`);
            } else {
                const vagasRestantes = LIMITE_POR_HORARIO - qtdAtual;
                alert(`Reserva das ${hora}h realizada com sucesso! (${qtdAtual}/${LIMITE_POR_HORARIO} - resta ${vagasRestantes} vaga). ${avisoLembrete}`);
            }

            verificarLembretes();
        }

        function cancelar_reserva(hora) {
            if (reservasPorHorario[hora] <= 0) {
                alert(`O horário das ${hora}h já está livre.`);
                return;
            }

            reservasPorHorario[hora]--;
            if (reservasPorHorario[hora] === 0) {
                lembretesEnviados[hora] = false;
            }

            atualizarHorario(hora);
            atualizarBlocoCancelar();
            alert(`Reserva das ${hora}h cancelada (${reservasPorHorario[hora]}/${LIMITE_POR_HORARIO}).`);
        }

        function atualizarHorario(hora) {
            const qtd = reservasPorHorario[hora];
            const lotado = qtd >= LIMITE_POR_HORARIO;
            const status = document.getElementById(`status_${hora}h`);
            const btnReservar = document.querySelector(`.reservas input[onclick="alterarReserva(${hora})"]`);
            const btnCancelar = document.querySelector(`.reservas_hrs input[onclick="cancelar_reserva(${hora})"]`);
            const itemCancelar = btnCancelar ? btnCancelar.parentElement : null;

            if (status) {
                status.style.fontWeight = "bold";

                if (qtd === 0) {
                    status.textContent = `Livre (0/${LIMITE_POR_HORARIO})`;
                    status.style.color = "#1b7f3b";
                } else if (qtd < LIMITE_POR_HORARIO) {
                    status.textContent = `Parcial (${qtd}/${LIMITE_POR_HORARIO})`;
                    status.style.color = "#d97706";
                } else {
                    status.textContent = `Lotado (${qtd}/${LIMITE_POR_HORARIO})`;
                    status.style.color = "#c1121f";
                }
            }

            if (btnReservar) {
                btnReservar.disabled = false;
                btnReservar.style.opacity = lotado ? "0.65" : "1";
                btnReservar.style.cursor = "pointer";
            }

            if (itemCancelar) {
                itemCancelar.style.display = qtd > 0 ? "block" : "none";
            }
        }

        function atualizarBlocoCancelar() {
            const blocoCancelar = document.getElementById("reservas_feitas");
            if (!blocoCancelar) return;

            const existeAlgumaReserva = Object.values(reservasPorHorario).some(qtd => qtd > 0);
            blocoCancelar.style.display = existeAlgumaReserva ? "block" : "none";
        }
    </script>
</body>
</html>
