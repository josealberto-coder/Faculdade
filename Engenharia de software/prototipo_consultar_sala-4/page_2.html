<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <title>Protótipo</title>
    <link rel="stylesheet" href="style/style2.css">

  

</head>
<body>
    <main>
        <article>
            <h1>Consulte os horários</h1>

            <div class = "sala_1">
                <h2>Sala-1</h2>

                <div class="consultar_horario">
                    <h3>Horário</h3>
                    <div class="horarios_1">
                        <ul>
                            <li>9h : <span id = "status_9h">Livre</span></li>
                            <li>10h: <span id = "status_10h">Livre</span></li>
                            <li>11h: <span id = "status_11h">Livre</span></li>
                        </ul>
                    </div>
                </div>

                <div class="reservar">
                    <h3>Reservar</h3>
                    <div class="reservas">
                        <ul>
                            <li>9h-<input type="button" value="Reservar" onclick="alterarReserva(9)"></li>
                            <li>10h-<input type="button" value="Reservar"onclick="alterarReserva(10)"></li>
                            <li>11h-<input type="button" value ="Reservar" onclick="alterarReserva(11)"></li>
                         
                        </ul>
                    </div>
                </div>
            </div>

            
            <div id="reservas_feitas">
                <h3 class="cancelar_reserva">Cancelar</h3>

                <div class="reservas_hrs">
                    <ul>
                        <li><input type="button" value=" 9h " onclick="cancelar_reserva(9)"></li>
                        <li><input type="button" value="10h" onclick="cancelar_reserva(10)"></li>
                        <li><input type="button" value="11h" onclick="cancelar_reserva(11)"></li>
                    </ul>

                </div>
            </div>

        </article>
        <a href="index.html" class="botao_voltar">
        <img src="image/botao_voltar.webp" alt="voltar">voltar</a>
    </main>








<script type ="text/javascript">
    let reservas = 0;



    const alterarReserva = (hora) => {
    const elementoStatus = document.getElementById(`status_${hora}h`);

    if (elementoStatus.innerText.toLowerCase() === "livre") {
        reservas = reservas+1;
        elementoStatus.innerText = "Ocupado"

        alert(`A sala foi reservada para horário ${hora}h`);

    }else{
        alert(`O horário das ${hora}h está ocupado.`);
    }
}



    const cancelar_reserva=(hora)=>{
        const status = document.getElementById(`status_${hora}h`);
    

        if(status.innerText.toLowerCase() === "ocupado"){
            status.innerText = "Livre";
            alert("Reserva cancelada com sucesso.");
            reservas -= 1;

        }else{
            alert("A sala está livre.");
    }
}

    if(reservas >= 0){
        document.getElementById('reservas_feitas').style.display = "block";   
    }else{
        document.getElementById("reservas_feitas").style.display = "none";
}

console.log(reservas);


  

</script>


</body>
</html>
