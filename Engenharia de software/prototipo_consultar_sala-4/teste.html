<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        header{
            
           
            background-color: antiquewhite;
            padding: 10px;
        }
        ul{
            width: 100%;
            columns: 3;
            text-align: center;
            list-style-type: none;
            list-style-position: inside;

        }
        ul> li{
            margin-left: 30px;
        }
    </style>

</head>
<body>
    <header>
        <ul>
            <li>sobre</li>
            <li>menu</li>
            <li>contato</li>
        </ul>
    </header>
</body>
</html>
